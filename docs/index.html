<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxShift</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: linear-gradient(180deg, #0b1220 0%, #05070c 100%);
    color: #f2f5fa;
  }
  main {
    max-width: 480px;
    padding: 32px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  p.tagline {
    color: #9fb0c8;
    margin-top: 0;
    margin-bottom: 32px;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-card {
    display: block;
    padding: 14px 20px;
    border-radius: 14px;
    background: #121a2c;
    border: 1px solid #ffffff14;
    color: #f2f5fa;
    text-decoration: none;
    font-size: 14px;
    transition: background 0.15s ease-out;
  }
  a.link-card:hover {
    background: #17203a;
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #6b7686;
  }
</style>
</head>
<body>
<main>
  <h1>VoxShift</h1>
  <p class="tagline">VRChatのマイクミュート状態とDiscordのセルフミュートを連動させるWindows常駐アプリ</p>
  <nav>
    <a class="link-card" href="https://github.com/glaz-egy/VoxShift">GitHub リポジトリ</a>
    <a class="link-card" href="privacy.html">プライバシーポリシー</a>
    <a class="link-card" href="terms.html">利用規約</a>
  </nav>
  <footer>&copy; 2026 glaz-egy</footer>
</main>
</body>
</html>
