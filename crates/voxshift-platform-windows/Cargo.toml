[package]
name = "voxshift-platform-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
voxshift-core = { path = "../voxshift-core" }
serde.workspace = true
serde_json.workspace = true
secrecy = "0.10"
zeroize = "1.9"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
