[workspace]
resolver = "2"
members = [
  "crates/voxshift-app",
  "crates/voxshift-core",
  "crates/voxshift-discord",
  "crates/voxshift-vrchat",
  "crates/voxshift-storage",
  "crates/voxshift-ui",
  "crates/voxshift-platform-windows",
  "tests/discord-mock",
  "tests/osc-mock",
  "tests/coordinator-tests",
  "tests/end-to-end",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "signal", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "5"
